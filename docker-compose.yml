services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: techstore-api
    restart: unless-stopped
    working_dir: /var/www/api
    volumes:
      - ./api:/var/www/api
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost
      FRONTEND_URL: http://localhost:5173
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-techstore}
      DB_USERNAME: ${MYSQL_USER:-techstore}
      DB_PASSWORD: ${MYSQL_PASSWORD:-password}
      REDIS_HOST: redis
      SESSION_DOMAIN: localhost
      SANCTUM_STATEFUL_DOMAINS: localhost:5173,127.0.0.1:5173
    depends_on:
      - mysql
      - redis
    networks:
      - app-network

  frontend:
    image: node:22-alpine
    container_name: techstore-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost/api
      VITE_API_ORIGIN: http://localhost
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: techstore-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./api:/var/www/api
      - ./frontend/dist:/var/www/frontend
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    container_name: techstore-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-techstore}
      MYSQL_USER: ${MYSQL_USER:-techstore}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: techstore-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - app-network

volumes:
  mysql_data:
  frontend_node_modules:

networks:
  app-network:
    driver: bridge
